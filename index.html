<title>鶯歌出遊趣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: control-room game shell — status header, quest card, isometric 3D viewport with overlay controls, wardrobe/collection dock. Single deliberate dark theme. */
:root{
  --bg:#f7ecda; --panel:#fffaf1; --panel2:#fdf1de; --line:#ead3b2; --fg:#4a3122; --muted:#8c6c55;
  --cyan:#ff8a5b; --yellow:#f6b43b; --red:#e0533d; --ok:#4fae6e;
  --surface:var(--panel2); --sunk:#f4e4cc; --celadon:var(--ok); --cobalt:#5aa7d8; --clay:var(--yellow); --ink-on-accent:#3a2316;
  --display:"Noto Sans TC","PingFang TC",sans-serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
.app{max-width:980px;margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.brand b{display:block;font-family:var(--display);font-size:22px;letter-spacing:.06em;line-height:1.1}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.2em}
@media (min-width:1100px){.app{max-width:1500px}.viewport{height:max(520px,calc(100vh - 290px))}}
.stats{display:flex;flex-wrap:wrap;gap:6px}.fshead{background:var(--yellow);color:#1b1404;border-color:var(--yellow);cursor:pointer;font-family:var(--body)}@media (hover:none){.fshead{display:none}}
.stat{border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat em{font-style:normal;color:#c8562f}
.clock{font-family:var(--display);letter-spacing:.04em}
.quest{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:14px;padding:12px 14px}
.quest .q{flex:1;min-width:0}
.quest .k{font-size:11px;letter-spacing:.16em;color:#c8562f;font-weight:700}
.quest h3{font-size:17px;margin:0;font-family:var(--body);font-weight:900}
.quest p{margin:0;font-size:13px;color:var(--muted)}
.tasks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.tasks li::before{content:"○";margin-right:6px;color:#c8562f}.tasks li.ok{color:var(--fg);text-decoration:line-through;text-decoration-color:var(--ok)}.tasks li.ok::before{content:"●";color:var(--ok)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px;color:var(--cyan);margin-right:6px}
.go{background:var(--yellow);color:#1b1404;border:0;border-radius:10px;padding:10px 18px;font:900 15px var(--body);cursor:pointer;box-shadow:0 3px 0 #a87d19}
.viewport{position:relative;height:clamp(380px,64vh,660px);border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#1b2f22}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.vstat{position:absolute;top:52px;left:10px;z-index:2;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 20px)}.vstat span{background:rgba(255,248,236,.92);border:1px solid #ead3b2;color:var(--fg);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}.vstat b{color:#c8562f}.riding .vstat{display:none}
.spots{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.spots::-webkit-scrollbar{display:none}
.spot{flex:none;background:rgba(255,248,236,.86);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:700 13px var(--body);cursor:pointer;backdrop-filter:blur(4px)}
.spot[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.ticker{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(255,248,236,.92);border:1px solid var(--red);color:var(--fg);padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;max-width:calc(100% - 24px);text-align:center;z-index:3}
.joy{position:absolute;left:14px;bottom:14px;width:132px;height:132px;border-radius:50%;touch-action:none;user-select:none;-webkit-user-select:none;z-index:2}
.joy-ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(255,250,240,.85),rgba(246,224,190,.85));border:3px solid #e8c79a;box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 0 0 10px rgba(255,255,255,.06)}
.joy-ring i{position:absolute;width:0;height:0;border:6px solid transparent;opacity:.7}
.joy-ring .jn{left:calc(50% - 6px);top:6px;border-bottom:8px solid #c8562f;border-top:0}.joy-ring .js{left:calc(50% - 6px);bottom:6px;border-top:8px solid #c8562f;border-bottom:0}
.joy-ring .jw{top:calc(50% - 6px);left:6px;border-right:8px solid #c8562f;border-left:0}.joy-ring .je{top:calc(50% - 6px);right:6px;border-left:8px solid #c8562f;border-right:0}
.joy-knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--yellow);border:4px solid #1b1404;box-shadow:0 5px 0 rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .12s ease-out;cursor:grab}
.joy-knob svg{width:30px;height:30px;fill:#1b1404}
.joy.on .joy-knob{transition:none;cursor:grabbing;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.joy.on .joy-ring{border-color:rgba(243,192,75,.9)}
@media (max-width:520px){.joy{width:118px;height:118px}.joy-knob{width:56px;height:56px;margin:-28px 0 0 -28px}}
.dpad{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.dpad button{background:#f2f5f8;border:0;border-radius:12px;box-shadow:0 4px 0 #b5c0cb;color:#0b1622;font-size:18px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;display:grid;place-items:center}
.dpad button:active,.dpad button.on{transform:translateY(3px);box-shadow:0 1px 0 #b5c0cb}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.camctl{position:absolute;right:10px;bottom:12px;display:grid;grid-template-columns:repeat(2,44px);gap:6px;direction:rtl}.camctl>*{direction:ltr}
.camctl button{width:44px;height:44px;background:rgba(255,248,236,.9);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:700 18px var(--body);cursor:pointer;display:grid;place-items:center}
.camctl svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.act{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--red);color:#fff;border:2px solid #ff5a6e;border-radius:14px;padding:12px 22px;font:900 17px var(--body);cursor:pointer;box-shadow:0 5px 0 #6e0718;white-space:nowrap;max-width:calc(100% - 260px);overflow:hidden;text-overflow:ellipsis;z-index:2}
@media (max-width:520px){.act{left:auto;right:112px;transform:none;max-width:calc(100% - 250px);padding:10px 14px;font-size:15px}.dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}}
.dock{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs .t{font-family:var(--body);font-weight:900;font-size:16px;margin-right:6px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font:700 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:rgba(79,209,255,.08)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;color:var(--fg);font:700 13px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.tile[aria-pressed="true"]{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.tile i{width:38px;height:38px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.15)}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
input[type=text]{font:500 15px var(--body);padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);color:var(--fg);width:100%;max-width:320px}
/* sheet + station content */
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;background:rgba(3,8,13,.62);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 8px}
.sheet-card{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:86%;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--body);font-weight:900;font-size:23px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--body);font-size:17px;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 4px;font-size:14px}
.label{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 16px;font:700 15px var(--body);cursor:pointer;background:var(--cyan);color:var(--ink-on-accent)}
.btn.ghost{background:var(--sunk);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}
.back{background:none;border:0;color:var(--cyan);font:700 14px var(--body);padding:0;cursor:pointer;margin-bottom:8px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok);color:var(--ink-on-accent)}
.food-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.food{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.food .disc{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff}
.food p{margin:0;font-size:12px;color:var(--muted)}
.wheel{display:flex;justify-content:center;background:var(--sunk);border-radius:14px;padding:8px}
.wheel svg{width:100%;max-width:280px;height:auto}
.slider{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:8px;font-size:13px}
.slider output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
input[type=range]{width:100%;accent-color:var(--cyan)}
.steps{display:flex;gap:6px}.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps span.on{background:var(--cyan)}
.quiz button{display:block;width:100%;text-align:left;margin-top:8px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.shelf figure{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;min-width:0}
.shelf svg{width:100%;height:auto}.shelf figcaption{font-size:12px;overflow-wrap:anywhere}
.stamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:420px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:12px;text-align:center;line-height:1.2;color:var(--muted);max-width:100%;padding:4px}
.stamp.on{border:2.5px solid var(--yellow);color:#c8562f;transform:rotate(-8deg);font-weight:900}
a.ext{color:var(--cyan);font-weight:700}
.kiln{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.kiln i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),#e0573a);transition:width 2.2s ease}
@keyframes spin{to{transform:translateX(-24px)}}
.spinning .ridges{animation:spin .5s linear infinite}
.stars{font-size:26px;color:#c8562f;letter-spacing:4px}
.bubble{border-left:4px solid var(--cyan)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:#f2efe8;border-radius:12px;padding:12px}.gallery figure{margin:0;text-align:center;color:#2a2622;font-size:12px;min-width:0}.gallery svg{width:100%;height:auto}
.enc{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.enc .panel{padding:10px}.enc h4{margin:0 0 4px;font-size:14px}.enc p{margin:0;font-size:12px;color:var(--muted)}.enc .lock{opacity:.4}
.route{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative;gap:2px}
.route::before{content:"";position:absolute;left:8%;right:8%;top:17px;height:6px;background:#4fb8dc;border-radius:3px}
.stop{position:relative;background:none;border:0;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:4px;font:700 11px var(--body);cursor:pointer;padding:0;min-width:0}
.stop .dot{width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid #4fb8dc;color:#1d3b4f;display:grid;place-items:center;font-size:10px;font-weight:900}
.stop.here .dot{background:#4fb8dc;color:#fff;box-shadow:0 0 0 3px rgba(79,184,220,.35)}.stop:disabled{cursor:default}.stop[data-go="LB07"]{opacity:.45}
.stop:not(:disabled):hover .dot{background:#e6f7fd}.stop .sn{text-align:center;line-height:1.2;overflow-wrap:anywhere}
.exrow{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:500 14px var(--body);cursor:pointer;width:100%}
.exrow b{font-size:15px;text-wrap:balance}.exrow .d{font-size:13px;color:var(--muted)}.exrow.soon,.exrow.past{opacity:.7}.exrow.open:hover{border-color:var(--cyan)}
.room{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}.room svg{display:block;width:100%;height:auto}
.hs{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:var(--yellow);border:2px solid #fff;color:#1b1404;font:900 16px var(--body);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.hs.on{background:var(--ok);color:#fff}
.lab-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.lab{font:700 12px var(--display);letter-spacing:.12em;color:var(--cyan)}
.exp{background:rgba(79,209,255,.12);border:1px solid var(--line);color:var(--cyan);font:700 15px var(--display);padding:8px 12px;border-radius:12px;white-space:nowrap}
.steptabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.steptabs div{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}.steptabs i{height:4px;border-radius:2px;background:var(--line)}
.steptabs .done i{background:var(--ok)}.steptabs .on i{background:var(--cyan)}.steptabs .on span{color:var(--cyan);font-weight:700}
.stepcard{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}.pill.cy{background:rgba(79,209,255,.15);color:var(--cyan)}
.lab-stage{background:radial-gradient(circle at 50% 40%,#1b3247,#0a1824 70%);border-radius:16px;display:flex;justify-content:center;padding:8px;touch-action:none}.lab-stage svg{width:100%;max-width:300px;height:auto}
.lab-stage.drag{cursor:ns-resize}.wobble svg{animation:wob .25s ease-in-out infinite alternate}@keyframes wob{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.meterRow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.meterRow b{color:var(--cyan)}
.meter{position:relative;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}.meter i{position:absolute;top:0;bottom:0;left:0;display:block}
.meter .zone{background:rgba(67,196,135,.35)}.meter .danger{background:rgba(200,16,46,.4)}#offBar,#dBar,#tBar{background:var(--cyan);border-radius:5px;transition:width .05s}
.meter .perfect,.meter .good{background:var(--ok)!important}.meter .bad{background:var(--red)!important}
.btn.big{padding:14px 22px;font-size:17px}.btn.big.on{transform:scale(.96);background:var(--yellow)}#hold{width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.judge{font:900 20px var(--display);opacity:0}.judge.pf{fill:#f3c04b}.judge.gd{fill:#43c487}.judge.ms{fill:#ff6b7f}.judge.pop{animation:jp .8s ease-out}@keyframes jp{0%{opacity:0;transform:translateY(8px)}25%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
.judgeTxt{margin:0;min-height:1.4em;font-weight:700;color:var(--muted)}.judgeTxt.pf{color:#c8562f}.judgeTxt.gd{color:var(--ok)}.judgeTxt.ms{color:#ff6b7f}
.rank{font:900 28px var(--display);width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);border:2px solid var(--line)}.rank.rS{color:#c8562f;border-color:#f3c04b}.rank.rA{color:var(--cyan)}
@media (prefers-reduced-motion:reduce){.wobble svg,.judge.pop{animation:none}.judge.pop{opacity:1}}
.route.bus{grid-template-columns:repeat(5,minmax(0,1fr))}.route.bus::before{background:#43c487}.route.bus .dot{border-color:#43c487}.route.bus .here .dot{background:#43c487}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:4}.flash.go{animation:fl .45s ease-out}@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.ph{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2);cursor:pointer;color:var(--fg);text-align:left}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.ph span{display:block;font-size:11px;padding:4px 6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc.sm{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;flex:none}
.course{display:flex;gap:12px;align-items:flex-start}.course h3{margin:0}.course .note{margin:2px 0 0}
.ticket{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1.5px dashed var(--yellow);border-radius:12px;background:rgba(243,192,75,.06)}.ticket>div{display:flex;flex-direction:column;min-width:0}.ticket.big{padding:14px}
.members{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.mem{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center;min-width:0}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font:900 20px var(--body);border:2px solid rgba(255,255,255,.2)}.av.add{background:var(--sunk);color:var(--muted)}.chip.sm{padding:2px 8px;font-size:11px}
.riding .dpad{display:none}
.camctl .metro{font-size:12px;background:#4fb8dc;color:#06202c;border-color:#4fb8dc;font-weight:900}
.ridebar{position:absolute;left:10px;right:62px;bottom:12px;z-index:3;background:rgba(255,248,236,.94);border:1.5px solid #4fb8dc;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rb-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rb-line{background:#4fb8dc;color:#06202c;font-weight:900;font-size:12px;border-radius:6px;padding:2px 8px}
.rb-track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}.rb-track::before{content:"";position:absolute;left:10%;right:10%;top:6px;height:4px;background:#2a4a5c;border-radius:2px}
.rb-st{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);text-align:center}.rb-st i{width:16px;height:16px;border-radius:50%;background:#0a1824;border:3px solid #4fb8dc}
.rb-st.p i{background:#4fb8dc}.rb-st.p{color:var(--fg)}.rb-st.dest i{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(243,192,75,.35)}.rb-st.dest{color:#c8562f;font-weight:700}

 {id:"artstair",kind:"sight",name:"美術館戶外大階梯",node:"msB",imgs:[["ASTR","從 2F 往下走的大階梯"],["AFAC2","直條立面、鏡面雨庇和大階梯"],["AFAC1","左邊是三鶯線鶯歌站"]],d:"美術館南側掛在立面外的戶外大階梯：從 2F 大廳的玻璃門出來，沿著不鏽鋼直條欄杆、木頭扶手一路往下走，頭上是一片斜斜的鏡面不鏽鋼雨庇，把草地、步道和走路的人都倒映在天花板上。下到底是灰色石材鋪面，接著木棧板就走進草地了。四周插著一根根帶圓孔的白色細柱，跟美術館的直條立面呼應。"},
 {id:"lawnpath",kind:"sight",name:"美術館草地步道",node:"bwk",imgs:[["BWK","鋪面接木棧板、穿過草地接到步道"],["PTH1","彎曲的柏油步道，右邊是三鶯線鶯歌站"],["PTH2","筆直的步道，遠方有白色雕塑和圓塔"],["PTH3","黃昏逆光的路燈"],["LAWN2","南邊的大草坡，遠方是運動中心"]],d:"從大階梯下來，深色木棧板橫過草地，接上一條兩側有清水模邊溝的柏油步道。步道彎彎地穿過大片草坪，路邊是一支支深咖啡色、頭上折一個彎的路燈；往前走看得到白色的不鏽鋼雕塑、遠方的圓塔，右手邊三鶯線列車從鶯歌站開出來。下午太陽斜照，很適合散步、野餐。"},
 {id:"artwalk",kind:"sight",name:"美術館耐候鋼走道",node:"awW",imgs:[["AWALK","耐候鋼走道與美術館"]],d:"從三鶯線鶯歌車站出來、往美術館方向的步道：兩側是鏽紅色的耐候鋼板牆，地面是紅磚人字鋪面，跨過馬路直接走到美術館。旁邊有玻璃欄杆，入口牌寫著禁止機車、單車和寵物進入。"},
 {id:"xinfeng",kind:"sight",name:"新鳳公園",node:"fPk",imgs:[["XF1","路口與公園入口"],["XF2","往桃園方向的路口"]],d:"在鶯桃路西側、靠近桃園區交界的社區公園，對面就是鳳鳴郵局。路口有紅綠燈、電線桿和「桃園區 Taoyuan District」「歡迎蒞臨桃園」的路牌，公園門口有矮樹籬和「新鳳公園」的白色招牌，旁邊排著 YouBike；背景是正在搭鷹架施工的新大樓，和一排有紅瓦塔頂的老公寓。"},
 {id:"fengming",kind:"sight",name:"鳳鳴郵局",node:"fPo",imgs:[["FMPO","轉角的郵局"]],d:"鶯桃路東側路口轉角的弧形大樓，和新鳳公園隔著鶯桃路相對，外牆貼著粉色小磁磚，一樓繞著一圈綠色的中華郵政 POST 招牌。門口有紅色郵筒、直立的郵局招牌，附近常停滿機車。"},
 {id:"sanyuan",kind:"sight",name:"三元市場",node:"syM",imgs:[["SY2","鳳吉四街口與市場大樓"],["SY1","桃園客運「三元市場」站牌"]],d:"沿鶯桃路往南走，過了鳳吉四街就到，位在鶯桃路東側的老市場：灰色水泥大樓一層層橫線，騎樓下是拉下鐵門的攤位和黃色雨遮，掛著「金香舖 福元堂」和紅底「綠人串烤」招牌。路口的站牌寫著桃園客運「三元市場 Sanyuan Market」，下面還有一塊粉紅色圓牌，是 L115 紅甲線。"},
 {id:"abodouhua",kind:"food",name:"阿伯豆花",node:"abd",imgs:[["ABDH","三元市場旁的店面"]],d:"鶯桃路與鳳吉四街口、三元市場旁的老字號豆花店，門口立著「阿伯 純手工豆花」看板，騎樓上掛著「30 週年慶・紅茶 綠茶 冬瓜茶 20 元」的布條。賣豆花、黑糖剉冰和綠豆沙牛奶。"},
 {id:"ytroad",kind:"sight",name:"鶯桃路彎道高架",node:"yjN",imgs:[["YTRD","鶯桃路口的大彎道高架"]],d:"沿鶯桃路往鶯桃福德站的方向，三鶯線在路口上方畫出一道大弧形高架，兩側是整排白色隔音板，中間只靠一根大柱子撐著。路口掛著藍色車道指示和綠色「高速公路 FREEWAY ② →」指標。"},
 {id:"fmjh",kind:"sight",name:"鳳鳴國中",node:"fJH",imgs:[["FMJH","鶯桃路旁的鳳鳴國中"]],d:"新北市立鳳鳴國民中學，在鶯桃路東側、往鶯桃福德站的路上，三鶯線高架就沿著學校旁的鶯桃路彎過去。白色的校舍側牆上點綴著黃色、紫色、橘色、藍色的圓點，屋頂有一座小塔架。臨路的一排店屋掛滿大型建案看板，例如「住鳳鳴 選京懋」和寫著「鶯桃福德站 550 米」的「陶園鳴」。"},
 {id:"fmes",kind:"sight",name:"鳳鳴國小",node:"fES",imgs:[["FMMAP","周邊地圖：國小在鶯桃路東側、鳳鳴公園旁"]],d:"照鳳鳴車站周邊地圖，鳳鳴國小在鶯桃路東側、鳳鳴國中的東南邊，隔著永和街，旁邊就是鳳鳴公園和鳳鳴機器人公園。紅瓦屋頂的校舍、紅磚校門，操場有紅色跑道。（外觀為遊戲示意，若有照片可再照實景調整。）"},
 {id:"fmpark",kind:"sight",name:"鳳鳴公園・機器人公園",node:"fRb",imgs:[["FMMAP","周邊地圖"]],d:"鳳鳴國小南邊的社區公園，一條小溪從旁邊流過；隔壁的鳳鳴機器人公園立著一座彩色方塊機器人。地圖上旁邊還有國立臺灣工藝研究發展中心鶯歌多媒材研發分館。（外觀為遊戲示意。）"},
 {id:"fmtra",kind:"sight",name:"臺鐵鳳鳴車站",node:"fmT",imgs:[["FMMAP","鳳鳴車站周邊地圖"]],d:"縱貫線上鶯歌和桃園之間的小車站，在大湖路、鶯歌路口，往北是龍五路、龍七路一帶的住宅區和鳳鳴夜市。依 Google 地圖：從佰樂工程行往東南方向，經過龍鳳夜市再過去就到。遊戲裡距離縮短了。（外觀為遊戲示意。）"},
 {id:"fmnight",kind:"sight",name:"鶯歌龍鳳夜市",node:"fmN",imgs:[["FMMAP","龍鳳夜市在佰樂工程行和鳳鳴車站之間"]],d:"依 Google 地圖，位在佰樂工程行和鳳鳴車站之間（龍三路、龍五路一帶）的在地夜市，傍晚一攤攤亮起燈泡，賣小吃、炸物和飲料。（攤位為遊戲示意。）"},
 {id:"sportsctr",kind:"sight",name:"鶯歌國民運動中心",node:"bS2",imgs:[["SC1","飛碟般的圓形場館"],["SC3","前方大草坪與步道"],["SC2","從美術館南側望過去"]],d:"美術館園區南端的圓形運動中心，像一架深灰色飛碟：一圈懸挑屋簷、上方一圈帶窗的玻璃帶、屋頂中央有天線。前面是車道、崗亭和整排綁著竹支架的新植樹，旁邊立著一座白色不鏽鋼雕塑；再過去是起伏的南高地大草坪和黑色路燈。"},
 {id:"artpark",kind:"sight",name:"美術館園區",node:"art",imgs:[["PKMAP","園區地圖"],["PKPLAN","新美聚場平面圖"],["PKROOF","1+ 天臺"],["PKARCO","C2 ARCO"]],d:"新北市美術館所在的大公園：北草坪、南草坪、北高地、南高地、新美聚所、戲水沙坑、滯洪池、三鶯之心，南邊是鶯歌國民運動中心，沿大漢溪自行車道往樹林、三峽。"},
 {id:"jianshan",kind:"sight",name:"尖山埔路天橋口",node:"jsA",imgs:[["IMG_JS_BRIDGE","天橋口與電梯塔"],["IMG_JS_TAOSHEN","陶神與歡迎彩繪牆"],["BEAR2","橋下的運動熊（2019 東亞青運動會）"],["IMG_JS_STREET","尖山埔路石板街"]],selfie:"陶神",d:"尖山埔路老街西端的天橋口。綠色鋼構天橋跨過鐵路，連到建國路那一側的三號公園入口，旁邊有畫滿鶯歌街景的電梯塔。橋下有陶瓶造型、戴著「陶神」黃帽的陶神公仔，背後是「歡迎 YINGGE 鶯歌」多國語言彩繪牆；再往橋下走，還有 2022 新北燈會留下的「運動熊」。老街路面是扇形排列的石板。路標寫著：新北市美術館 1000 m／15 分、捷運陶瓷老街站 200 m／3 分、鶯歌陶瓷博物館 500 m／6 分、鶯歌火車站 600 m／7 分。"},
 {id:"jianguo",kind:"sight",name:"三號公園・建國路入口",node:"jgR",imgs:[["IMG_JG_BEAR","友誼熊"],["IMG_JG_PIER","馬賽克橋墩與紅磚步道"],["IMG_JG_ROAD","建國路人行道"]],selfie:"友誼熊",d:"走過天橋、下樓梯就到建國路這一側。紅磚人字步道沿著草地延伸，三鶯線高架從頭頂經過，橋墩貼著綠色馬賽克磚。綠色竹節造型欄杆前坐著「友誼熊」，底座寫著 2022 新北燈會、台灣泰迪熊協會 × amanojack design。旁邊有綠色玻璃圓頂的小亭子。"},
 {id:"taihwa",kind:"sight",name:"臺華窯 餐器生活館",node:"taihwa",imgs:[["IMG_TAIHWA","老街上的店面"]],d:"尖山埔路老街上的臺華窯餐器生活館。四層樓的磚造店屋，白色鐵窗陽台和綠色雨遮很好認，門口常停著機車。可以進去逛逛各式餐具與生活陶瓷。"},
 {id:"park3",kind:"sight",name:"鶯歌三號公園",node:"park3",d:"沿著老街往西走，過了星巴克就到了；繼續往西是尖山埔路天橋口，走天橋過鐵路就是建國路入口。有草地、大陶瓶裝置、溜滑梯和長椅，逛完老街可以帶著飲料點心來這裡休息。"},
 {id:"yongji",kind:"sight",name:"永吉公園",node:"yongji",d:"三鶯線 LB11 永吉公園站旁的社區公園。環狀步道兩側種滿櫻花，中間有一座小水池，花季時整片粉紅，很適合散步拍照。"},
 {id:"bilong",kind:"sight",name:"鶯歌碧龍宮",node:"blV",img:"bilong",d:"位在鶯歌山區步道旁的廟宇。登山口有一面刻著鶯歌登山步道路線圖的石牆，旁邊插滿廟旗；網路遊記常提到廟旁的觀景平台可以四面眺望。從這裡也能沿步道接往鶯歌石。"},
 {id:"xiying",kind:"sight",name:"西鶯活動中心",node:"xyC",img:"xiying",d:"里民聚會、上課和辦活動的社區活動中心。正面兩側有對稱的戶外樓梯直通二樓，招牌上寫著「2005年5月立」。"},
 {id:"taoguan",kind:"sight",name:"鶯歌老街陶館",node:"taoguan",d:"老街上醒目的紅磚洋樓，進去逛逛各式陶瓷作品。"},
 {id:"xinwang",kind:"sight",name:"新旺集瓷",node:"xinwang",d:"老街旁的陶瓷選物店，可以挑選日常使用的陶瓷器。"},
 {id:"lr2",kind:"sight",lr:1,name:"三鶯線 陶瓷老街站",node:"lr2",imgs:[["LB9A","1 號出口正面"],["LB9B","站前廣場"],["LB9C","站旁的林蔭步道"],["LB9D","馬賽克橋墩與停車場"]],d:"LB09，在三號公園的重慶街側，緊鄰大漢溪。從老街的喝茶天旁走樓梯下去就到。藍色鋁板站體夾著黃綠色細條，像一個盒子掛在高架軌道下；1 號出口前是鋪面廣場和林蔭步道，旁邊的橋墩貼著綠色馬賽克。出站往老街方向走上樓梯，就在喝茶天旁邊，大約 3–5 分鐘。"},
 {id:"lr4",kind:"sight",lr:1,name:"三鶯線 國華站",node:"lr4",d:"LB10 國華站，往鶯桃福德方向的中途站。"},
 {id:"lr5",kind:"sight",lr:1,name:"三鶯線 永吉公園站",node:"lr5",img:"yj",d:"LB11，就在永吉公園旁。高架車站下方是一片開闊的廣場：白色大柱子、看得到管線的天花板、往上的寬樓梯，柱子旁還有黃色樹冠、彩色玻璃圓片、小鳥、白兔和笑臉機器人的公共藝術。下一站就是終點鶯桃福德。"},
 {id:"lr3",kind:"sight",lr:1,name:"三鶯線 鶯桃福德站",node:"lr3",imgs:[["FD3","LB12 出入口與 YouBike"],["FDPF","月台與月台門"],["FDW1","站內造景牆"],["FD4","高架下的機車停車場"],["FUDE1","高架軌道與站體"],["FUDE2","2 號出入口"]],d:"LB12 終點站。高架軌道兩側是白色隔音板，站體藏在軌道下方，2 號出入口是灰色懸挑雨遮，轉角有黃色三角塊和大大的「2」。站外遠望就是山景。"},

 {id:"mrt",kind:"sight",lr:1,name:"三鶯線 鶯歌車站",node:"mrt",imgs:[["LB8ART","從車上看新北市美術館"],["LB8PF","月台：白色鋼構屋頂"],["LB8EXIT","出口資訊看板"]],d:"LB08，可以轉乘臺鐵。月台是白色的放射狀鋼管屋頂。出口：1 鶯歌車站（台鐵）、2 館前路（鶯歌古鐘樓公園、陶瓷博物館）、3 新北市美術館（鶯歌國民運動中心）、4 三鶯轉運站（合興窯煙囪、鶯歌石）。從 3 號出口沿通道走下樓梯，接上耐候鋼走道，就到美術館。"},

const BL_OCC={t:0,on:new Map(),rc:new THREE.Raycaster(),pts:[[-41.7,.6,-15.3],[-41.7,1.6,-15.3],[-41.7,2.8,-14.7],[-42.5,1,-14.4],[-40.9,1,-14.4]]};
function tickBaileOcc(dt){const T=camS.target,near=!inside&&Math.hypot(T.x+41.7,T.z+15.3)<11;BL_OCC.t-=dt;
  if(BL_OCC.t<=0){BL_OCC.t=.25;const hit=new Set();
    if(near){const dir=new THREE.Vector3();cam.getWorldDirection(dir).negate();
      for(const p of BL_OCC.pts){BL_OCC.rc.set(new THREE.Vector3(...p),dir);BL_OCC.rc.far=120;BL_OCC.rc.camera=cam;
        for(const h of BL_OCC.rc.intersectObjects(world.children,true)){const o=h.object;if(!o.isMesh||o.isSprite||!o.visible)continue;let a=o,bl=false;while(a&&a!==world){if(a.userData.isBaile){bl=true;break}a=a.parent}
          if(bl||h.point.y<.15)continue;const bb=o.geometry.boundingSphere||(o.geometry.computeBoundingSphere(),o.geometry.boundingSphere);if(bb&&bb.radius>40)continue;hit.add(o)}}}
    for(const o of hit)if(!BL_OCC.on.has(o)){const orig=o.material;const mk=m=>{const c=m.clone();c.transparent=true;c.userData.o=m.opacity;return c};o.material=Array.isArray(orig)?orig.map(mk):mk(orig);BL_OCC.on.set(o,{orig,f:1,want:.22})}
    for(const [o,r] of BL_OCC.on)r.want=hit.has(o)?.22:1}
  for(const [o,r] of BL_OCC.on){r.f+=(r.want-r.f)*Math.min(1,dt*6);const ms=Array.isArray(o.material)?o.material:[o.material];for(const m of ms){m.opacity=(m.userData.o??1)*r.f;m.depthWrite=r.f>.9}
    if(r.want===1&&r.f>.98){const ms2=Array.isArray(o.material)?o.material:[o.material];ms2.forEach(m=>m.dispose());o.material=r.orig;BL_OCC.on.delete(o)}}}

function cr(p){let d="";for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;

  if(p==="dot")return `<pattern id="${id}" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.6" fill="${ink}" opacity=".8"/></pattern>`;
  const P0=(w,h,inner)=>`<pattern id="${id}" width="${w}" height="${h}" patternUnits="userSpaceOnUse"><g stroke="${ink}" fill="none" stroke-width="1.8" opacity=".8" stroke-linecap="round" stroke-linejoin="round">${inner}</g></pattern>`;
  if(p==="grid")return P0(16,16,`<path d="M0 8H16M8 0V16"/>`);
  if(p==="zigzag")return P0(24,14,`<path d="M0 11 L6 3 L12 11 L18 3 L24 11"/>`);
  if(p==="scale")return P0(20,12,`<path d="M0 12 A10 10 0 0 1 20 12"/><path d="M-10 6 A10 10 0 0 1 10 6 M10 6 A10 10 0 0 1 30 6"/>`);
  if(p==="meander")return P0(22,22,`<path d="M3 19V3H19V15H7V7H15V11H11"/>`);
  if(p==="flower")return `<pattern id="${id}" width="26" height="26" patternUnits="userSpaceOnUse"><g fill="${ink}" opacity=".8">${[0,72,144,216,288].map(a=>`<ellipse cx="13" cy="8.5" rx="2.4" ry="4" transform="rotate(${a} 13 13)"/>`).join("")}</g><circle cx="13" cy="13" r="2" fill="#d4a640"/></pattern>`;
  if(p==="vine")return P0(48,32,`<path d="M0 16 C12 2 20 2 24 16 S36 30 48 16"/><path d="M12 7 q5 -6 9 -2 q-4 5 -9 2Z M36 25 q-5 6 -9 2 q4 -5 9 -2Z" fill="${ink}"/><circle cx="24" cy="16" r="2.4" fill="${ink}"/>`);

function motif(x,m,px,py,s,c){x.save();x.translate(px,py);x.fillStyle=c;x.strokeStyle=c;x.lineWidth=Math.max(1.5,s*.12);x.lineCap="round";x.lineJoin="round";
  if(m==="flower"){for(let i=0;i<5;i++){x.save();x.rotate(i*Math.PI*2/5);x.beginPath();x.ellipse(0,-s*.45,s*.22,s*.4,0,0,Math.PI*2);x.fill();x.restore()}x.fillStyle="#d4a640";x.beginPath();x.arc(0,0,s*.17,0,Math.PI*2);x.fill()}
  if(m==="leaf"){x.rotate(-.5);x.beginPath();x.moveTo(0,s*.7);x.quadraticCurveTo(s*.55,0,0,-s*.7);x.quadraticCurveTo(-s*.55,0,0,s*.7);x.fill();x.strokeStyle="rgba(255,255,255,.55)";x.beginPath();x.moveTo(0,s*.6);x.lineTo(0,-s*.55);x.stroke()}
  if(m==="fish"){x.beginPath();x.ellipse(0,0,s*.55,s*.3,0,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(s*.45,0);x.lineTo(s*.85,-s*.3);x.lineTo(s*.85,s*.3);x.closePath();x.fill();x.fillStyle="#fff";x.beginPath();x.arc(-s*.3,-s*.06,s*.07,0,Math.PI*2);x.fill()}
  if(m==="star"){x.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.25:s*.6,a=i*Math.PI/5-Math.PI/2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill()}
  if(m==="cloud"){x.beginPath();x.arc(-s*.32,s*.05,s*.26,0,Math.PI*2);x.arc(0,-s*.12,s*.32,0,Math.PI*2);x.arc(s*.34,s*.05,s*.26,0,Math.PI*2);x.fill();x.strokeStyle="rgba(255,255,255,.6)";x.beginPath();x.arc(0,-s*.1,s*.14,Math.PI*.2,Math.PI*1.8);x.stroke()}
  if(m==="bird"){x.beginPath();x.ellipse(0,0,s*.45,s*.28,-.15,0,Math.PI*2);x.fill();x.beginPath();x.arc(-s*.42,-s*.2,s*.2,0,Math.PI*2);x.fill();
    x.beginPath();x.moveTo(-s*.6,-s*.22);x.lineTo(-s*.82,-s*.14);x.lineTo(-s*.6,-s*.1);x.fill();
    x.beginPath();x.moveTo(s*.35,-s*.05);x.lineTo(s*.8,-s*.3);x.lineTo(s*.75,s*.05);x.closePath();x.fill();
    x.strokeStyle="rgba(255,255,255,.6)";x.beginPath();x.moveTo(-s*.1,-s*.08);x.quadraticCurveTo(s*.15,-s*.35,s*.32,-s*.05);x.stroke();
    x.fillStyle="#fff";x.beginPath();x.arc(-s*.46,-s*.24,s*.05,0,Math.PI*2);x.fill()}
  x.restore()}
function paintStrokes(cv,f,strokes){const x=cv.getContext("2d"),k=cv.width/200;x.clearRect(0,0,cv.width,cv.height);x.save();x.scale(k,k);x.clip(new Path2D(potPath(f)));
  for(const s of strokes){if(s.t==="line"){x.strokeStyle=s.c;x.lineWidth=s.w;x.lineCap="round";x.lineJoin="round";x.beginPath();s.pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));if(s.pts.length===1)x.lineTo(s.pts[0][0]+.01,s.pts[0][1]);x.stroke()}

addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==="Escape"){if(!$("#sheet").hidden){closeSheet();e.preventDefault();return}const mp=$("#musicPanel");if(!mp.hidden){mp.hidden=true;return}if(navState){cancelNav();return}}
  if(e.code==="ShiftLeft"||e.code==="ShiftRight")keys.run=1;
  if(!$("#sheet").hidden)return;
  const c=e.code;let used=true;
  if(c==="KeyO")$("#spin720").click();else if(c==="KeyQ")camS.goal+=Math.PI/4;else if(c==="KeyE")camS.goal-=Math.PI/4;
  else if(c==="Equal"||c==="NumpadAdd")camS.goalZoom=Math.min(2.4,camS.goalZoom*1.25);else if(c==="Minus"||c==="NumpadSubtract")camS.goalZoom=Math.max(.36,camS.goalZoom/1.25);
  else if(c==="KeyH")$("#home").click();else if(c==="KeyC")takePhoto();else if(c==="KeyM")musicToggle();else if(c==="KeyN")musicNext();
  else if(c==="KeyB"){if(S.bike)$("#bikeBtn").click();else if(near&&near.type==="bike")mountBike();else toast("附近沒有你的 YouBike；到捷運站可以借車")}
  else if(c==="KeyT")$("#metroBtn").click();else if(c==="KeyL")$("#nightBtn").click();
  else if(/^Digit[1-9]$/.test(c)){const tabs=[...document.querySelectorAll("[data-tab]")],b=tabs[+c.slice(5)-1];if(b){if(document.body.classList.contains("nobar"))toggleBar();b.click()}}
  else if(e.key==="?"||(c==="Slash"&&e.shiftKey))showKeys();else used=false;
  if(used)e.preventDefault()});

/* ===== 旅人造訪紀錄：共用資料庫累計造訪人數、次數與遊玩分鐘 ===== */
(async()=>{
  const el=$("#vstat");
  let db=null,user=null;
  try{db=await claude.use("db");user=await claude.use("user")}catch(e){}
  if(!db||!user)return;            // 未登入或此檢視不支援：不顯示
  let me;try{me=await user.id()}catch(e){return}
  const ref=db.doc("visitors/"+me);let mine={visits:0,minutes:0};
  try{const s=await ref.get();if(s.exists)mine=Object.assign(mine,s.data())}catch(e){return}
  mine.visits=(mine.visits||0)+1;const now=Date.now();mine.first=mine.first||now;mine.last=now;
  let canWrite=true;
  try{await ref.set(mine)}catch(e){canWrite=false}
  let rows=[];
  const fmt=n=>Math.round(n).toLocaleString("en-US");
  const render=()=>{const people=rows.length,visits=rows.reduce((a,r)=>a+(+r.visits||0),0),mins=rows.reduce((a,r)=>a+(+r.minutes||0),0);
    if(!people){el.hidden=true;return}el.hidden=false;
    el.innerHTML=`<span title="來過鶯歌生活誌的旅人">👀 <b>${fmt(people)}</b> 位旅人</span><span title="累計造訪次數">🚉 <b>${fmt(visits)}</b> 次造訪</span><span title="大家在鶯歌度過的時間">⏱ <b>${fmt(mins)}</b> 分鐘</span>`};
  db.collection("visitors").orderBy("minutes","desc").limit(1000).onSnapshot(q=>{rows=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{el.hidden=true});
  window.vstatTop=async()=>{const top=rows.slice(0,8);let ps={};try{ps=await user.profiles(top.map(r=>r.id))}catch(e){}
    return top.map((r,i)=>({rank:i+1,name:(ps[r.id]&&ps[r.id].name)||(r.id===me?"你":"旅人"),me:r.id===me,minutes:Math.round(+r.minutes||0),visits:+r.visits||0}))};
  el.style.cursor="pointer";el.onclick=async()=>{const t=await vstatTop();openSheet();
    main.innerHTML=`${back()}<div class="stack"><div><span class="label">旅人造訪紀錄</span><h2>鶯歌旅人排行</h2><p class="note" style="margin:0">依在遊戲裡度過的分鐘數排序，只計算登入 Claude 的旅人。</p></div>
     <ol class="stack" style="list-style:none;padding:0;margin:0;gap:6px">${t.map(r=>`<li class="panel" style="display:flex;justify-content:space-between;align-items:center;${r.me?"border:1.5px solid var(--yellow)":""}"><span><b>${r.rank===1?"👑":r.rank+"."}</b> <span class="vn"></span></span><span class="note">${r.minutes} 分鐘・${r.visits} 次</span></li>`).join("")}</ol></div>`;
    main.querySelectorAll(".vn").forEach((s,i)=>s.textContent=t[i].name+(t[i].me&&t[i].name!=="你"?"（你）":""));wireBack()};
  if(!canWrite)return;
  // 每玩滿一分鐘（分頁在前景）寫一次自己的分鐘數
  let acc=0,lastT=performance.now();
  setInterval(async()=>{const t=performance.now(),d=(t-lastT)/1000;lastT=t;if(document.hidden)return;acc+=d;
    if(acc>=60){const add=Math.floor(acc/60);acc-=add*60;mine.minutes=(mine.minutes||0)+add;mine.last=Date.now();try{await ref.set(mine)}catch(e){}}},15000);
})();

  const all=wishAll(),N=Math.min(36,all.length);

    x.fillStyle=w.color||"#f3c04b";x.beginPath();x.moveTo(14,0);x.lineTo(82,0);x.lineTo(96,16);x.lineTo(96,128);x.lineTo(0,128);x.lineTo(0,16);x.closePath();x.fill();

    x.fillStyle=(w.color==="#ffffff"||w.color==="#f3c04b")?"#3a2a10":"#fff";x.font='800 17px "Noto Sans TC",sans-serif';x.textAlign="center";
    const t=w.text.replace(/\s+/g," ");for(let k=0;k<4;k++){const seg=t.slice(k*5,k*5+5);if(seg)x.fillText(seg+(k===3&&t.length>20?"…":""),48,42+k*22)}

    const ring=i<14?0:i<26?1:2,per=ring===0?14:ring===1?12:10,a=(i-(ring===0?0:ring===1?14:26))/per*Math.PI*2+ring*.4,R=[4.05,3.45,2.55][ring],y=[1.05,2.35,3.55][ring];
    m.position.set(XT[0]+Math.cos(a)*R,y,XT[1]+Math.sin(a)*R);m.rotation.y=-a+Math.PI/2;m.userData.ph=i*1.7;wishG.add(m)}

(async()=>{try{WISH.db=await claude.use("db");WISH.user=await claude.use("user")}catch(e){}
